<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b96522">
  <title>Monal Peshawar</title>
  <style>
    :root {
      --ink: #241b16;
      --muted: #76675d;
      --orange: #b96522;
      --orange-dark: #8f4519;
      --gold: #d88a3d;
      --line: rgba(129, 77, 36, .18);
      --panel: rgba(255, 253, 249, .94);
      --panel-strong: #fffaf4;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: #fffdf9;
      font: 15px/1.55 Georgia, "Times New Roman", serif;
    }

    #matrix {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      opacity: .08;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 0%, rgba(216, 138, 61, .11), transparent 42%),
        linear-gradient(135deg, rgba(255, 253, 249, .98), rgba(248, 239, 227, .9));
    }

    .shell {
      width: min(100% - 32px, 940px);
      min-height: 100vh;
      margin: auto;
      padding: 32px 0 28px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 22px;
    }

    .topbar, .chat-panel, .composer {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(91, 48, 19, .1), inset 0 1px white;
      backdrop-filter: blur(16px);
    }

    .topbar {
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      animation: rise .65s ease both;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--orange);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--orange-dark);
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      line-height: 1;
      letter-spacing: .01em;
      text-shadow: 0 2px 0 rgba(216, 138, 61, .16);
    }

    .subtitle { margin: 10px 0 0; color: var(--muted); }
    .signal {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #4f754c;
      font-size: 12px;
      white-space: nowrap;
    }
    .signal::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6e9d62;
      box-shadow: 0 0 14px rgba(110, 157, 98, .55);
      animation: pulse 1.7s ease-in-out infinite;
    }

    .chat-panel {
      min-height: 420px;
      padding: 28px;
      animation: rise .75s .08s ease both;
    }

    .welcome { max-width: 650px; }
    .welcome h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .welcome p { margin: 0; color: var(--muted); }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 24px;
    }
    .suggestion {
      border: 1px solid rgba(185, 101, 34, .28);
      border-radius: 999px;
      padding: 9px 14px;
      color: var(--orange-dark);
      background: rgba(255, 248, 237, .9);
      cursor: pointer;
      transition: .2s ease;
    }
    .suggestion:hover, .suggestion:focus-visible {
      border-color: var(--orange);
      color: var(--orange-dark);
      background: #fff1df;
      box-shadow: 0 0 18px rgba(185, 101, 34, .16);
      outline: none;
    }

    #messages { display: grid; gap: 14px; margin-top: 28px; }
    .message {
      max-width: 78%;
      padding: 13px 16px;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      animation: message-in .3s ease both;
    }
    .message.user {
      justify-self: end;
      color: white;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      border-radius: 14px 14px 3px 14px;
    }
    .message.assistant {
      justify-self: start;
      color: var(--ink);
      background: var(--panel-strong);
      border-radius: 14px 14px 14px 3px;
    }
    .message.error { color: #9a2929; border-color: rgba(180, 55, 55, .35); }
    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--orange);
      font-size: 13px;
    }
    .thinking-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: thinking 1s ease-in-out infinite;
    }
    .thinking-dot:nth-child(2) { animation-delay: .15s; }
    .thinking-dot:nth-child(3) { animation-delay: .3s; }

    .composer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      animation: rise .85s .16s ease both;
    }
    #question {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 11px 14px;
      color: var(--ink);
      background: transparent;
      font: inherit;
    }
    #question::placeholder { color: #9b8d82; }
    #send {
      border: 0;
      border-radius: 8px;
      padding: 11px 17px;
      color: white;
      background: var(--orange);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }
    #send:hover:not(:disabled), #send:focus-visible:not(:disabled) {
      background: var(--orange-dark);
      box-shadow: 0 0 20px rgba(185, 101, 34, .3);
      outline: none;
    }
    #send:disabled { cursor: wait; opacity: .55; }

    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes message-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 50% { opacity: .4; transform: scale(.75); } }
    @keyframes thinking { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(185, 101, 34, .22);
      border-top: 2px solid var(--orange);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @media (max-width: 600px) {
      .shell { width: min(100% - 18px, 940px); padding-top: 10px; gap: 12px; }
      .topbar, .chat-panel { padding: 20px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .chat-panel { min-height: calc(100vh - 220px); }
      .message { max-width: 92%; }
      .composer { position: sticky; bottom: 10px; }
      #send { padding-inline: 13px; }
    }
  </style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Monal Peshawar</p>
        <h1>Ask Monal.</h1>
        <p class="subtitle">A direct line to the restaurant's menu, buffet, and branch details.</p>
      </div>
      <div class="signal">Knowledge link online</div>
    </header>

    <section class="chat-panel" aria-live="polite">
      <div class="welcome">
        <h2>What can I help you discover?</h2>
        <p>Ask a question and I will search Monal's restaurant information for a grounded answer.</p>
      </div>
      <div class="suggestions" aria-label="Suggested questions">
        <button class="suggestion" type="button">What is included in the buffet?</button>
        <button class="suggestion" type="button">What is the address of Monal Peshawar?</button>
        <button class="suggestion" type="button">Show me vegetarian options.</button>
      </div>
      <div id="messages"></div>
    </section>

    <form class="composer" id="chat-form">
      <input id="question" name="question" type="text" maxlength="1000" autocomplete="off" placeholder="Ask about Monal Peshawar..." required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const canvas = document.getElementById('matrix');
    const context = canvas.getContext('2d');
    const glyphs = '01MONAL<>[]{}';
    let columns = 0;
    let drops = [];

    function resizeMatrix() {
      const scale = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * scale;
      canvas.height = window.innerHeight * scale;
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      context.setTransform(scale, 0, 0, scale, 0, 0);
      columns = Math.ceil(window.innerWidth / 18);
      drops = Array.from({ length: columns }, () => Math.random() * -40);
    }

    function drawMatrix() {
      context.fillStyle = 'rgba(3, 11, 19, .12)';
      context.fillRect(0, 0, window.innerWidth, window.innerHeight);
      context.font = '12px monospace';
      for (let index = 0; index < drops.length; index += 1) {
        const character = glyphs[Math.floor(Math.random() * glyphs.length)];
        context.fillStyle = index % 9 === 0 ? 'rgba(185, 101, 34, .34)' : 'rgba(151, 92, 42, .14)';
        context.fillText(character, index * 18, drops[index] * 18);
        if (drops[index] * 18 > window.innerHeight && Math.random() > .975) drops[index] = 0;
        drops[index] += .45;
      }
      requestAnimationFrame(drawMatrix);
    }
    resizeMatrix();
    window.addEventListener('resize', resizeMatrix);
    drawMatrix();

    const form = document.getElementById('chat-form');
    const input = document.getElementById('question');
    const send = document.getElementById('send');
    const messages = document.getElementById('messages');
    const apiBaseUrl = (window.MONAL_API_URL || '').replace(/\/$/, '');

    function addMessage(text, role, extraClass = '') {
      const message = document.createElement('div');
      message.className = `message ${role} ${extraClass}`;
      message.textContent = text;
      messages.appendChild(message);
      message.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function addThinkingMessage() {
      const message = document.createElement('div');
      message.className = 'message assistant thinking-message';
      message.innerHTML = 'Monal is thinking <span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span>';
      messages.appendChild(message);
      message.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return message;
    }

    function formatAnswer(text) {
      return text
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/^\s*\*\s+/gm, '• ')
        .replace(/^\s*-\s+/gm, '• ')
        .replace(/^\s*#{1,6}\s+/gm, '')
        .replace(/\*+/g, '')
        .trim();
    }

    async function ask(question) {
      const cleanQuestion = question.trim();
      if (!cleanQuestion || send.disabled) return;
      addMessage(cleanQuestion, 'user');
      input.value = '';
      send.disabled = true;
      send.innerHTML = '<span class="spinner"></span>Loading';
      const thinkingMessage = addThinkingMessage();
      try {
        const response = await fetch(`${apiBaseUrl}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: cleanQuestion })
        });
        const responseText = await response.text();
        let payload;
        try {
          payload = JSON.parse(responseText);
        } catch {
          throw new Error(`The chatbot service returned an unexpected response (${response.status}).`);
        }
        if (!response.ok) throw new Error(payload.detail || 'The chatbot could not answer right now.');
        addMessage(formatAnswer(payload.answer), 'assistant');
      } catch (error) {
        addMessage(error.message, 'assistant', 'error');
      } finally {
        thinkingMessage.remove();
        send.disabled = false;
        send.textContent = 'Send';
        send.innerHTML = 'Send';
        input.focus();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      ask(input.value);
    });
    document.querySelectorAll('.suggestion').forEach((button) => {
      button.addEventListener('click', () => ask(button.textContent));
    });
  </script>
</body>
</html>
